<table width="100%" cellpadding="0" cellspacing="0" style="font-family:'Inter', system-ui, sans-serif; background:#030712; color:#f8fafc; padding:40px 0; min-height:100vh;">
  <tr>
    <td align="center" style="padding:0 12px;">
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        role="presentation"
        style="background:#0b1220; border-radius:24px; padding:48px 32px; border:1px solid rgba(255,255,255,0.06); max-width:520px; box-shadow:0 20px 40px rgba(15,23,42,0.3);"
      >
        <tr>
          <td align="center" style="padding:0 12px;">
            <p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.5px;color:#64748b;text-transform:uppercase;">Verity Protect</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 12px 20px;">
            <div style="display:inline-block; width:56px; height:56px; background:linear-gradient(135deg, #2d7cff 0%, #1d4ed8 100%); border-radius:16px; line-height:56px;">
              <span style="color:#fff; font-size:28px;">✉️</span>
            </div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 12px;">
            <h1 style="margin:0 0 12px;font-size:28px;color:#f8fafc;line-height:1.2;font-weight:600;">Confirm Your Email</h1>
            <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#94a3b8;">
              Welcome to Verity Protect! We just need to verify <strong style="color:#cbd5e1;">{{ .Email }}</strong> to get you started.
            </p>
            <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin-top:4px;">
              <tr>
                <td align="center">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="background:#2d7cff; border-radius:12px; padding:14px 40px; color:#fff; text-decoration:none; font-weight:600; font-size:16px; text-align:center; display:inline-block; box-shadow:0 4px 12px rgba(45,124,255,0.3);"
                  >
                    Confirm Email Address
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding-top:40px;">
            <div style="height:1px; background:rgba(255,255,255,0.06);"></div>
          </td>
        </tr>
        <tr>
          <td style="padding-top:32px; font-size:13px; line-height:1.5; color:#64748b; text-align:center;">
            <p style="margin:0 0 20px;">Didn't request this? You can safely ignore this email.</p>
          </td>
        </tr>
        <tr>
          <td style="text-align:center; font-size:12px; color:#475569;">
            Verity Protect · <a href="https://verityprotect.com" style="color:#64748b; text-decoration:none;">verityprotect.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
