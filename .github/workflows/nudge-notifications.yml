name: Onboarding nudge notifications

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  send-onboarding-nudges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Send onboarding nudge notifications
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          APNS_AUTH_KEY_ID: ${{ secrets.APNS_AUTH_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_PRODUCTION: ${{ secrets.APNS_PRODUCTION }}
          APPLE_APP_STORE_BUNDLE_ID: ${{ secrets.APPLE_APP_STORE_BUNDLE_ID }}
        run: |
          cd backend
          npx ts-node --transpile-only scripts/send-nudge-notifications.ts
