name: Trial reminder emails

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  send-trial-reminder-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Send trial reminder emails
        env:
          NODE_ENV: production
          TRIAL_REMINDER_EMAIL_WINDOW_DAYS: 1
          SUPPORT_PORTAL_URL: https://verityprotect.com/support
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          npx ts-node --transpile-only scripts/send-trial-reminder-email.ts
